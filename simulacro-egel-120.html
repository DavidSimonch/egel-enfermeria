<!doctype html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="camera=(), microphone=(), geolocation=(), payment=(), usb=()">
    <title>Simulacro EGEL | 120 reactivos</title>
    <script src="catalogo-simuladores.js"></script>
    <style>
        :root{--navy:#163b65;--blue:#0c6cb5;--teal:#087d74;--ink:#172536;--muted:#5e6d7e;--paper:#fff;--line:#d8e1e9;--wash:#eef5f8;--warning:#a45408}*{box-sizing:border-box}body{margin:0;min-width:320px;font-family:Georgia,"Times New Roman",serif;color:var(--ink);background:#edf4f7}.wrap{width:min(980px,calc(100% - 28px));margin:auto;padding:26px 0 54px}.top{display:flex;justify-content:space-between;gap:20px;align-items:end;padding-bottom:18px;border-bottom:5px solid var(--navy)}.eyebrow{margin:0 0 7px;color:var(--teal);font:700 12px Arial,sans-serif;letter-spacing:.12em;text-transform:uppercase}h1,h2,h3,p{margin-top:0}h1{margin-bottom:7px;font-size:clamp(29px,5vw,44px)}.sub{margin:0;color:var(--muted);font-size:17px}.timer{min-width:125px;padding:10px 14px;color:#fff;background:var(--navy);text-align:center;font:700 25px/1 Arial,sans-serif}.timer small{display:block;margin-bottom:4px;font-size:10px;letter-spacing:.08em;text-transform:uppercase}.panel{margin-top:24px;padding:clamp(20px,4vw,34px);background:var(--paper);border:1px solid var(--line);box-shadow:7px 7px 0 #dbe7ec}.hidden{display:none!important}.meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;color:var(--muted);font:700 14px Arial,sans-serif}.progress{height:8px;margin:14px 0 24px;overflow:hidden;background:#dce6ec}.progress div{height:100%;background:var(--teal);transition:width .2s}.scenario{padding:18px;border-left:5px solid var(--blue);background:#f5f9fb;line-height:1.55}.question{margin:24px 0 15px;font-size:22px;line-height:1.35}.options{display:grid;gap:10px}.option{width:100%;padding:15px;border:1px solid #b8c6d0;border-radius:4px;color:var(--ink);background:#fff;text-align:left;cursor:pointer;font:700 16px/1.35 Arial,sans-serif}.option:hover{border-color:var(--blue);background:#f4f9fc}.option.selected{border:2px solid var(--teal);background:#e9f6f3}.actions{display:flex;justify-content:space-between;gap:12px;margin-top:28px}.button{border:0;border-radius:4px;padding:12px 16px;color:#fff;background:var(--navy);cursor:pointer;font:700 15px Arial,sans-serif;text-decoration:none}.button:hover{background:var(--blue)}.button.secondary{color:var(--navy);background:#dfeaf0}.button.finish{background:#a45408}.button:disabled{cursor:not-allowed;opacity:.5}.notice{padding:14px;border-left:4px solid var(--warning);background:#fff7e8;color:#704001;font:15px/1.45 Arial,sans-serif}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.stat{padding:16px;border:1px solid var(--line);background:#f8fbfc;text-align:center;font:14px Arial,sans-serif}.stat b{display:block;margin-bottom:5px;color:var(--navy);font-size:30px}.review{display:grid;gap:9px}.review-item{padding:14px;border-left:4px solid #bd3e35;background:#fff7f6;font:14px/1.45 Arial,sans-serif}.review-item.correct{border-color:#198557;background:#f0fbf5}.review-item h3{margin-bottom:7px;font-size:17px}@media(max-width:600px){.top{align-items:start;flex-direction:column}.timer{width:100%;font-size:22px}.stats{grid-template-columns:1fr}.actions{flex-wrap:wrap}.actions .button{flex:1}.question{font-size:20px}}
    </style>
</head>
<body>
    <main class="wrap">
        <header class="top"><div><p class="eyebrow">Simulacro cronometrado</p><h1>EGEL Enfermería</h1><p class="sub" id="studentLabel"></p></div><div class="timer" id="timer"><small>Tiempo restante</small>04:30:00</div></header>
        <section class="panel" id="exam"><div class="meta"><span id="counter"></span><span id="answered"></span></div><div class="progress"><div id="progressBar"></div></div><article class="scenario"><strong id="source"></strong><p id="scenario"></p></article><h2 class="question" id="prompt"></h2><div class="options" id="options"></div><div class="actions"><button class="button secondary" id="previous">Anterior</button><button class="button" id="next">Siguiente</button><button class="button finish" id="finish">Finalizar</button></div></section>
        <section class="panel hidden" id="result"><p class="eyebrow">Resultado final</p><h2>Simulacro completado</h2><p class="sub" id="resultStudent"></p><div class="stats"><div class="stat"><b id="correct"></b>Aciertos</div><div class="stat"><b id="incorrect"></b>Errores u omisiones</div><div class="stat"><b id="score"></b>Calificación / 100</div></div><div class="notice">La revisión muestra la respuesta correcta al finalizar el simulacro.</div><div class="review" id="review"></div><div class="actions"><a class="button secondary" href="index.html">Volver al menú</a><a class="button" href="simulacro-egel-120.html">Nuevo sorteo</a></div></section>
    </main>
    <script>
        const QUESTION_COUNT=120,DURATION_SECONDS=4.5*60*60;
        const student=sessionStorage.getItem('egel_student_name');
        const group=sessionStorage.getItem('egel_student_group')||'';
        if(!student)location.replace('index.html');
        const shuffle=(items)=>{const shuffled=[...items];for(let index=shuffled.length-1;index>0;index--){const randomIndex=Math.floor(Math.random()*(index+1));[shuffled[index],shuffled[randomIndex]]=[shuffled[randomIndex],shuffled[index]]}return shuffled};
        const questions=shuffle(window.BANCO_PREGUNTAS_EGEL||[]).slice(0,QUESTION_COUNT);let currentQuestion=0;let answers=Array(questions.length).fill(null);let remainingSeconds=DURATION_SECONDS;let completed=false;
        const getElement=(id)=>document.getElementById(id);
        function formatTime(seconds){const hours=Math.floor(seconds/3600),minutes=Math.floor(seconds%3600/60),secondsPart=seconds%60;return [hours,minutes,secondsPart].map((part)=>String(part).padStart(2,'0')).join(':')}
        function renderQuestion(){const question=questions[currentQuestion];getElement('counter').textContent=`Reactivo ${currentQuestion+1} de ${questions.length}`;getElement('answered').textContent=`Respondidos: ${answers.filter((answer)=>answer!==null).length}/${questions.length}`;getElement('progressBar').style.width=`${(currentQuestion+1)/questions.length*100}%`;getElement('source').textContent=question.source;getElement('scenario').textContent=question.scenario||'Selecciona la respuesta más adecuada.';getElement('prompt').textContent=question.prompt;getElement('options').innerHTML='';question.options.forEach((option,index)=>{const button=document.createElement('button');button.className=`option${answers[currentQuestion]===index?' selected':''}`;button.type='button';button.textContent=`${String.fromCharCode(65+index)}. ${option}`;button.addEventListener('click',()=>{answers[currentQuestion]=index;renderQuestion()});getElement('options').appendChild(button)});getElement('previous').disabled=currentQuestion===0;getElement('next').disabled=currentQuestion===questions.length-1}
        function finishExam(){if(completed)return;completed=true;clearInterval(timer);getElement('exam').classList.add('hidden');getElement('result').classList.remove('hidden');const correct=questions.reduce((total,question,index)=>total+(answers[index]===question.answer?1:0),0);const incorrect=questions.length-correct;getElement('resultStudent').textContent=group?`${student} · Grupo/Sección: ${group}`:student;getElement('correct').textContent=correct;getElement('incorrect').textContent=incorrect;getElement('score').textContent=Math.round(correct/questions.length*100);const review=getElement('review');review.innerHTML=questions.map((question,index)=>{const selected=answers[index];const isCorrect=selected===question.answer;const response=selected===null?'Sin respuesta':question.options[selected];return `<article class="review-item${isCorrect?' correct':''}"><h3>${index+1}. ${question.prompt}</h3><p><strong>Tu respuesta:</strong> ${response}</p><p><strong>Correcta:</strong> ${question.options[question.answer]}</p></article>`}).join('')}
        const timer=setInterval(()=>{remainingSeconds--;getElement('timer').lastChild.textContent=formatTime(Math.max(remainingSeconds,0));if(remainingSeconds<=0)finishExam()},1000);
        getElement('studentLabel').textContent=group?`${student} · ${group}`:student;getElement('timer').innerHTML=`<small>Tiempo restante</small>${formatTime(remainingSeconds)}`;
        getElement('previous').addEventListener('click',()=>{if(currentQuestion>0){currentQuestion--;renderQuestion()}});getElement('next').addEventListener('click',()=>{if(currentQuestion<questions.length-1){currentQuestion++;renderQuestion()}});getElement('finish').addEventListener('click',()=>{if(confirm('¿Deseas finalizar el simulacro? No podrás modificar tus respuestas.'))finishExam()});
        if(questions.length!==QUESTION_COUNT){document.body.innerHTML='<main class="wrap"><section class="panel"><h1>Banco de reactivos no disponible</h1><p>Regresa al menú y vuelve a generar el catálogo.</p></section></main>'}else renderQuestion();
    </script>
</body>
</html>
